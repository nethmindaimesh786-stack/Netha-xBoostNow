<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080711">
<title>NETHA X ULTIMATE</title>

<style>
:root {
  --bg:#080711;
  --purple:#9b5cff;
  --blue:#397dff;
  --cyan:#35eaff;
  --white:#f7f5ff;
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  min-height:100vh;
  overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--white);
  background:var(--bg);
  opacity:1;
  transition:opacity .3s ease;
}

body.fade-out {
  opacity:0;
}

.background {
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 20% 20%,#6023a53b,transparent 42%),
    radial-gradient(ellipse at 85% 70%,#1263c73b,transparent 43%),
    #080711;
}

.glow {
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  filter:blur(95px);
  opacity:.35;
  animation:float 8s ease-in-out infinite alternate;
}

.glow.one {
  background:#8b35ff;
  top:-100px;
  left:-100px;
}

.glow.two {
  background:#087cff;
  right:-120px;
  bottom:-80px;
  animation-delay:-4s;
}

.grid {
  position:absolute;
  inset:0;
  opacity:.09;
  background-image:
    linear-gradient(#ffffff12 1px,transparent 1px),
    linear-gradient(90deg,#ffffff12 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:linear-gradient(to bottom,black,transparent 85%);
}

.main {
  position:relative;
  z-index:1;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px 20px;
  text-align:center;
}

.logo-wrap {
  position:relative;
  width:150px;
  height:150px;
  display:grid;
  place-items:center;
  margin-bottom:38px;
}

.orbit {
  position:absolute;
  inset:0;
  border:1px solid #9b76ff55;
  border-radius:50%;
  box-shadow:0 0 25px #774bff22;
  animation:rotate 15s linear infinite;
}

.orbit::before {
  content:"";
  position:absolute;
  width:9px;
  height:9px;
  top:13px;
  left:28px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 15px var(--cyan);
}

.orbit.second {
  inset:12px;
  border-color:#39caff44;
  animation:rotateReverse 12s linear infinite;
}

.logo {
  position:relative;
  width:100px;
  height:100px;
  display:grid;
  place-items:center;
  border-radius:30px;
  font-size:35px;
  font-weight:950;
  letter-spacing:-2px;
  color:white;
  background:linear-gradient(140deg,#8b38ff,#376eff 65%,#16dfff);
  border:1px solid #ffffff55;
  box-shadow:
    0 0 20px #8b50ff99,
    0 0 55px #326bff55,
    inset 0 1px 12px #ffffff55;
  animation:pulse 2.5s ease-in-out infinite alternate;
}

.eyebrow {
  color:#a99bda;
  font-size:10px;
  font-weight:750;
  letter-spacing:5px;
  margin-bottom:15px;
}

h1 {
  font-size:clamp(30px,9vw,43px);
  font-weight:950;
  letter-spacing:2px;
  line-height:1.15;
  background:linear-gradient(
    95deg,
    #ffffff,
    #bda5ff,
    #70baff,
    #53edff
  );
  background-size:200% auto;
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
  animation:shine 5s linear infinite;
}

.subtitle {
  margin-top:15px;
  color:#aaa5c5;
  font-size:12px;
  letter-spacing:2.5px;
}

.line {
  width:95px;
  height:2px;
  margin-top:28px;
  border-radius:10px;
  background:linear-gradient(90deg,transparent,var(--purple),var(--cyan),transparent);
  box-shadow:0 0 15px #706aff;
}

.bottom-text {
  position:absolute;
  bottom:34px;
  left:0;
  width:100%;
  color:#77728f;
  font-size:9px;
  letter-spacing:3px;
}

@keyframes rotate {
  to {transform:rotate(360deg)}
}

@keyframes rotateReverse {
  to {transform:rotate(-360deg)}
}

@keyframes float {
  from {transform:translate(0,0)}
  to {transform:translate(35px,45px)}
}

@keyframes pulse {
  from {transform:scale(.97);filter:brightness(.9)}
  to {transform:scale(1.04);filter:brightness(1.2)}
}

@keyframes shine {
  to {background-position:200% center}
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none !important;
  }
}
</style>
</head>

<body>

<div class="background">
  <div class="glow one"></div>
  <div class="glow two"></div>
  <div class="grid"></div>
</div>

<main class="main">

  <div class="logo-wrap">
    <div class="orbit"></div>
    <div class="orbit second"></div>
    <div class="logo">NX</div>
  </div>

  <div class="eyebrow">THE NEXT GENERATION</div>

  <h1>NETHA X<br>ULTIMATE</h1>

  <p class="subtitle">A NEW EXPERIENCE BEGINS</p>

  <div class="line"></div>

  <div class="bottom-text">
    DESIGNED FOR EXCELLENCE
  </div>

</main>

<script>
window.addEventListener("load", function () {
  setTimeout(function () {
    document.body.classList.add("fade-out");

    setTimeout(function () {
      window.location.replace("index.html");
    }, 300);

  }, 3700);
});
</script>

</body>
</html>
