name: Import NETHA Downloader source

on:
  push:
    paths:
      - ".github/workflows/import-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the exact upstream project used by the supplied ZIP
        run: |
          git clone --depth 1 https://github.com/deniscerri/ytdlnis.git upstream

      - name: Replace repository with downloader source
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          root = pathlib.Path(".")
          source = pathlib.Path("upstream")
          workflow = root / ".github/workflows/import-source.yml"
          workflow_bytes = workflow.read_bytes()

          excluded = {".git", ".idea", ".kotlin", ".gradle", "build"}
          for item in list(root.iterdir()):
              if item.name in {".git", "upstream"}:
                  continue
              if item.is_dir():
                  shutil.rmtree(item)
              else:
                  item.unlink()

          for item in source.iterdir():
              if item.name in excluded:
                  continue
              dest = root / item.name
              if item.is_dir():
                  shutil.copytree(item, dest, ignore=shutil.ignore_patterns("*.log", "build"))
              else:
                  shutil.copy2(item, dest)

          (root / ".github/workflows").mkdir(parents=True, exist_ok=True)
          (root / ".github/workflows/import-source.yml").write_bytes(workflow_bytes)

          manifest = root / "app/src/main/AndroidManifest.xml"
          if manifest.exists():
              s = manifest.read_text()
              s = s.replace('android:label="YTDLnis"', 'android:label="NETHA DOWNLOADER"')
              manifest.write_text(s)

          readme = root / "README.md"
          if readme.exists():
              note = """# NETHA DOWNLOADER (modified YTDLnis build)

          This repository contains a modified build of [YTDLnis](https://github.com/deniscerri/ytdlnis), originally created by Denis Çerri. The upstream project is licensed under GNU GPL v3; see [LICENSE](LICENSE). Upstream copyright and license notices are retained.

          ---

          """
              original = readme.read_text()
              if not original.startswith("# NETHA DOWNLOADER"):
                  readme.write_text(note + original)
          PY

      - name: Configure NETHA debug build workflow
        shell: bash
        run: |
          cat > .github/workflows/android.yml <<'YAML'
          name: Android Build
          on:
            push:
              branches: ["**"]
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: "17"
                    cache: gradle
                - name: Build APK
                  run: |
                    chmod +x gradlew
                    ./gradlew assembleGithubDebug --stacktrace
                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: NETHA-DOWNLOADER-debug
                    path: app/build/outputs/apk/github/debug/*.apk
                    if-no-files-found: error
          YAML
          rm -rf upstream

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import NETHA DOWNLOADER source project"
          git push
