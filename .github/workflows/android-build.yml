name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build optimized debug APK
        run: |
          chmod +x gradlew
          touch local.properties
          ./gradlew assembleGithubDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NETHA-DOWNLOADER-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
