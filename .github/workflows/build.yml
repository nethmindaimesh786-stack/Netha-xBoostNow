name: Build APK

on:
  push:
    branches:
      - main
      - keyboard-zip-import
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew :keyboard:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netha-keyboard-ultra-debug
          path: keyboard/build/outputs/apk/debug/keyboard-debug.apk
          if-no-files-found: error
